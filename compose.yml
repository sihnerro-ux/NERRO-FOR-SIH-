name: ner-logistics

services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ner_logistics}
      POSTGRES_USER: ${POSTGRES_USER:-ner_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ner_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ner_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ner_app} -d ${POSTGRES_DB:-ner_logistics}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ner_evidence_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ner_local_evidence_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ner_evidence_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-ner_local_redis_password}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ner_local_redis_password}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgis
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ner_logistics}
      DB_USER: ${POSTGRES_USER:-ner_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ner_local_password}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-ner_evidence_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ner_local_evidence_password}
      S3_BUCKET: ${S3_BUCKET:-ner-field-evidence}
      S3_SECURE: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ner_local_redis_password}
      WORKER_TOKEN: ${WORKER_TOKEN:-ner_local_worker_token}
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-before-deployment}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-480}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      NER_GEOCODER_USER_AGENT: ${NER_GEOCODER_USER_AGENT:-ner-logistics-sih-prototype/1.0}
    depends_on:
      postgis:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ner_local_redis_password}
      WORKER_NAME: ner-event-relay
      WORKER_TOKEN: ${WORKER_TOKEN:-ner_local_worker_token}
      BACKEND_INTERNAL_URL: http://backend:8000
      WEATHER_REFRESH_INTERVAL_SECONDS: ${WEATHER_REFRESH_INTERVAL_SECONDS:-900}
      WEATHER_INITIAL_DELAY_SECONDS: ${WEATHER_INITIAL_DELAY_SECONDS:-20}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ner_postgis_data:
  ner_evidence_data:
