services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: ner-logistics-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ner_logistics
      POSTGRES_USER: ner_app
      POSTGRES_PASSWORD: ner_local_password
    ports:
      - "5432:5432"
    volumes:
      - ner_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ner_app -d ner_logistics"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ner_postgis_data:

